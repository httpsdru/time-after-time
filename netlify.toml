# Netlify build + deploy config

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — every unknown path serves index.html so React Router can handle it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache static assets that Vite hashes anyway.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache the admin shell — we want CMS updates to land instantly.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
